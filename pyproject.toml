[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ternfold-lang"
version = "0.0.1"
description = "A language for inspectable, guarded state transitions — architecture foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
ternfold = "ternfold.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1",
  "hypothesis==6.168.0", "coverage==7.16.0", "build==1.6.1",
  "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ternfold = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["native: requires a C17 compiler", "property: generated invariant tests", "slow: extended stress tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "experiments", "tests"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["ternfold"]

[tool.coverage.report]
show_missing = true
