name: Lexical source verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_zip_url:
        description: Public source ZIP release asset to verify instead of Git archive
        required: false
        type: string
permissions:
  contents: read
jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract the source submission from the exact commit
        shell: bash
        env:
          SOURCE_ZIP_URL: ${{ inputs.source_zip_url }}
        run: |
          set -eu
          if [ -n "$SOURCE_ZIP_URL" ]; then
            case "$SOURCE_ZIP_URL" in
              https://github.com/afkDen/PPL_Group1_LexicalAnalyzer/releases/download/*) ;;
              *) echo 'Expected this repository source-release asset'; exit 2 ;;
            esac
            curl --fail --location "$SOURCE_ZIP_URL" --output "$RUNNER_TEMP/Professor_Final_Source.zip"
            shasum -a 256 "$RUNNER_TEMP/Professor_Final_Source.zip"
          else
            git -c core.autocrlf=false archive --format=zip --output "$RUNNER_TEMP/Professor_Final_Source.zip" HEAD
          fi
          mkdir "$RUNNER_TEMP/Ternfold source submission"
          unzip -q "$RUNNER_TEMP/Professor_Final_Source.zip" -d "$RUNNER_TEMP/Ternfold source submission"
      - name: Compile, test and demonstrate extracted source
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/Ternfold source submission"
          uname -a
          cc --version
          sh scripts/build.sh environment
          sh scripts/build.sh check
          sh scripts/build.sh sanitize
          ./build/ternfold-lexer examples/lexical/complete.tfd --classroom --output-dir build
          cmp 'build/Symbol Table.txt' 'tests/fixtures/lexer/Classroom Symbol Table.txt'
          set +e
          ./build/ternfold-lexer examples/lexical/invalid.tfd --classroom --output-dir build
          invalid=$?
          ./build/ternfold-lexer does-not-exist.txt --classroom --output-dir build
          extension=$?
          set -e
          test "$invalid" = 1
          test "$extension" = 1
          grep '^INVALID' 'build/Symbol Table.txt'
          ./build/ternfold-lexer examples/lexical/complete.tfd --classroom --output-dir build
          cmp 'build/Symbol Table.txt' 'Symbol Table.txt'
          # Same four-file compile and root-directory run as the IDE guide.
          cc -std=c17 -Wall -Wextra -pedantic -Iinclude src/main.c src/lexer.c src/source.c src/report.c -o ternfold-lexer
          ./ternfold-lexer examples/lexical/complete.tfd --classroom --output-dir .
          cmp 'Symbol Table.txt' 'tests/fixtures/lexer/Classroom Symbol Table.txt'
          ./ternfold-lexer examples/lexical/complete.tfd --classroom --output-dir . --trace-dfa 2>build/live-trace.txt
          grep 'DFA name' build/live-trace.txt
          grep 'FINAL' build/live-trace.txt
          cmp 'Symbol Table.txt' 'tests/fixtures/lexer/Classroom Symbol Table.txt'
          set +e
          ./ternfold-lexer >build/no-argument.txt 2>&1
          no_argument=$?
          ./ternfold-lexer examples/lexical/invalid.tfd --classroom --output-dir .
          invalid=$?
          ./ternfold-lexer README.md --classroom --output-dir . 2>build/extension.txt
          extension=$?
          set -e
          test "$no_argument" = 2
          test "$invalid" = 1
          test "$extension" = 1
          grep 'expected source.tfd' build/no-argument.txt
          grep 'extension must be exactly .tfd' build/extension.txt
          cmp 'Symbol Table.txt' 'tests/fixtures/lexer/Invalid Classroom Symbol Table.txt'
          ./ternfold-lexer examples/lexical/complete.tfd --classroom --output-dir .
          cmp 'Symbol Table.txt' 'tests/fixtures/lexer/Classroom Symbol Table.txt'
