name: Build lexical executables and all-in-one archive
on:
  workflow_dispatch:
    inputs:
      source_zip_url:
        description: Source release ZIP in this repository
        required: true
        type: string
      source_sha256:
        description: Source ZIP SHA-256 (64 hexadecimal digits)
        required: true
        type: string
permissions:
  contents: read
env:
  SOURCE_URL: ${{ inputs.source_zip_url }}
  SOURCE_SHA256: ${{ inputs.source_sha256 }}
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned source and LLVM-MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./distribution/validate-input.ps1 -SourceZipUrl $env:SOURCE_URL -SourceSha256 $env:SOURCE_SHA256
          Invoke-WebRequest $env:SOURCE_URL -OutFile "$env:RUNNER_TEMP/source.zip"
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile "$env:RUNNER_TEMP/toolchain.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/toolchain.zip").Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') { throw 'Compiler archive SHA mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/toolchain.zip" "$env:RUNNER_TEMP/toolchain"
          $cc = "$env:RUNNER_TEMP/toolchain/llvm-mingw-20261020-ucrt-x86_64/bin/clang.exe"
          "PAYLOAD_CC=$cc" >> $env:GITHUB_ENV
          ./distribution/build-windows.ps1 -SourceZip "$env:RUNNER_TEMP/source.zip" -SourceSha256 $env:SOURCE_SHA256 -Compiler $cc -Destination "$env:RUNNER_TEMP/windows-payload"
          # Canonical gates run on a separate copy; packaged source remains exact.
          Expand-Archive "$env:RUNNER_TEMP/source.zip" "$env:RUNNER_TEMP/source-check"
      - name: Windows native check
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/source-check/scripts/build.ps1" check -Compiler $env:PAYLOAD_CC'
      - name: Windows ASan and UBSan
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/source-check/scripts/build.ps1" sanitize -Compiler $env:PAYLOAD_CC'
      - name: Verify Windows payload from fresh ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP/windows-payload/*" -DestinationPath "$env:RUNNER_TEMP/windows.zip"
          ./distribution/verify-windows.ps1 -Zip "$env:RUNNER_TEMP/windows.zip" -SourceSha256 $env:SOURCE_SHA256 -Destination "$env:RUNNER_TEMP/Windows fresh extraction"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-payload
          path: ${{ runner.temp }}/windows.zip
          if-no-files-found: error
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build native Mac payload; canonical check and sanitizers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          sh distribution/validate-input.sh "$SOURCE_URL" "$SOURCE_SHA256"
          curl --fail --location "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          sh distribution/build-mac.sh "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/mac-payload" "$SOURCE_SHA256"
          test -f "$RUNNER_TEMP/mac-payload/bin/$TARGET/ternfold-lexer"
          cd "$RUNNER_TEMP/mac-payload"
          zip -q -r "$RUNNER_TEMP/$TARGET.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-payload
          path: ${{ runner.temp }}/${{ matrix.target }}.zip
          if-no-files-found: error
  assemble:
    needs: [windows, mac]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-payload'
          path: ${{ runner.temp }}/payloads
          merge-multiple: true
      - name: Assemble one ZIP with Unix executable modes
        shell: bash
        run: |
          sh distribution/assemble.sh "$RUNNER_TEMP/payloads/windows.zip" "$RUNNER_TEMP/payloads/macos-arm64.zip" "$RUNNER_TEMP/payloads/macos-x64.zip" "$RUNNER_TEMP/Ternfold_Lexical_Static_DFA_All_In_One_2026-10-30.zip" "$SOURCE_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: combined-candidate
          path: |
            ${{ runner.temp }}/Ternfold_Lexical_Static_DFA_All_In_One_2026-10-30.zip
            ${{ runner.temp }}/Ternfold_Lexical_Static_DFA_All_In_One_2026-10-30.zip.sha256
          if-no-files-found: error
  verify-combined:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: combined-candidate
          path: ${{ runner.temp }}/combined
      - name: Verify exact combined ZIP on Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/combined/Ternfold_Lexical_Static_DFA_All_In_One_2026-10-30.zip"
          $expected = (Get-Content "$zip.sha256").Substring(0,64)
          if ((Get-FileHash $zip).Hash.ToLowerInvariant() -ne $expected) { throw 'Combined ZIP hash mismatch' }
          ./distribution/verify-windows.ps1 -Zip $zip -SourceSha256 $env:SOURCE_SHA256 -Destination "$env:RUNNER_TEMP/Combined fresh extraction" -Combined
      - name: Verify exact combined ZIP on native Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          zip="$RUNNER_TEMP/combined/Ternfold_Lexical_Static_DFA_All_In_One_2026-10-30.zip"
          expected=$(cut -c 1-64 "$zip.sha256")
          test "$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" = "$expected"
          sh distribution/verify-mac.sh "$zip" "$RUNNER_TEMP/Combined fresh extraction" "$SOURCE_SHA256"
  verified-candidate:
    needs: verify-combined
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: combined-candidate
          path: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: verified-all-in-one
          path: candidate/*
          if-no-files-found: error
      # Produces verified artifacts only; release publication is separate.
