Read runtime.md, core-ir.md and ADR 0006 before editing. C runtime must obey borrowed-input/owned-output API, checked 64-bit values and fault order, immutable acyclic child/capture ownership, and source-verified Core. No text substitution backend. Test failures and reference counts; differential test all 0.2 operators and I/O after both paths exist. No unnecessary external services.
Read AGENTS.md and the owning task brief; keep scope bounded. Use project .agents/skills instructions when useful. Report files changed (or none), exact commands/results, residual risk and suggested next action. Do not mark roadmap complete: the supervisor verifies and records acceptance.

